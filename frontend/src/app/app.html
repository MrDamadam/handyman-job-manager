<div class="container">
  <h1>Handyman Job Manager</h1>

  <section class="customers">
    <h2>Customers</h2>
    <app-customers
      [customers]="customers()"
      [customerError]="customerError()"
      (createCustomer)="createCustomerFromForm($event)"
      (customerUpdated)="saveCustomer($event)"
      (deleteCustomer)="deleteCustomer($event)"
    ></app-customers>

  </section>

  <section class="jobs">
    <h2>Jobs</h2>
    <app-jobs
      [jobs]="jobs()"
      [customers]="customers()"
      [jobError]="jobError()"
      (createJob)="createJobFromForm($event)"
      (jobUpdated)="saveJob($event)"
      (deleteJob)="deleteJob($event)"
    ></app-jobs>
  </section>

  <section class="invoices">
    <h2>Invoices</h2>
    <app-invoices
      [invoices]="invoices()"
      [payments]="payments()"
      [jobs]="jobs()"
      [invoiceError]="invoiceError()"
      (createInvoice)="createInvoiceFromForm($event)"
      (invoiceUpdated)="saveInvoice($event)"
      (deleteInvoice)="deleteInvoice($event)"
    ></app-invoices>
  </section>

  <section class="payments">
    <h2>Payments</h2>
    <app-payments
      [payments]="payments()"
      [invoices]="invoices()"
      [paymentError]="paymentError()"
      (createPayment)="createPaymentFromForm($event)"
      (deletePayment)="deletePayment($event)"
    ></app-payments>
  </section>
</div>
